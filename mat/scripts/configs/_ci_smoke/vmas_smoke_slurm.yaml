# Same smoke test as vmas_smoke.yaml, but routed through Slurm (see
# .github/workflows/train-on-push.yml): the presence of a top-level
# `slurm:` key is what selects Slurm-mode dispatch via iruka2.
# Push to branch `train/_ci_smoke/vmas_smoke_slurm` to trigger it.
slurm:
  script: mat/scripts/run_yaml_slurm.sh

resources:
  num_gpus: 1
  gpus_per_run: 1

defaults:
  script: train/train_vmas.py
  cwd: mat/scripts
  cuda_visible_devices: auto
  env:
    MPLBACKEND: Agg
    MPLCONFIGDIR: /tmp/matplotlib-cache
    DISPLAY: ""
  args:
    env_name: VMAS
    scenario_name: navigation
    algorithm_name: mat
    experiment_name: ci_smoke_vmas_slurm
    seed: 1
    n_training_threads: 1
    n_rollout_threads: 1
    n_eval_rollout_threads: 1
    episode_length: 10
    num_env_steps: 20
    ppo_epoch: 1
    num_mini_batch: 1
    vmas_n_agents: 4
    vmas_continuous_actions: true
    vmas_device: cpu
    # See mat/config.py: --use_wandb is `action='store_false'`, so *setting*
    # it here (true) is what disables wandb logging.
    use_wandb: true

runs:
  - name: vmas_smoke_slurm
