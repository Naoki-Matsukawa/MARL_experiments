# See vmas_smoke_slurm.yaml for the pattern. Push to
# train/_ci_smoke/jaxmarl_robotarium_smoke_slurm to trigger it.
#
# Known issue (see docker/README.md): this env hits a reproducible
# jaxlib/cuSolver error on this cluster's GPUs during env.step, so this run
# is expected to fail there too — kept as a smoke test of the *dispatch*
# path (does Slurm route this config through Apptainer with the JAX env
# vars set), not of the environment itself.
slurm:
  script: mat/scripts/run_yaml_apptainer_slurm.sh

resources:
  num_gpus: 1
  gpus_per_run: 1

defaults:
  script: train/train_jaxmarl_robotarium.py
  cwd: mat/scripts
  cuda_visible_devices: auto
  args:
    env_name: JaxMARLRobotarium
    scenario_name: discovery
    num_agents: 4
    algorithm_name: mat
    experiment_name: ci_smoke_jaxmarl_robotarium_slurm
    seed: 1
    n_training_threads: 1
    n_rollout_threads: 1
    n_eval_rollout_threads: 1
    episode_length: 10
    num_env_steps: 20
    ppo_epoch: 1
    num_mini_batch: 1
    # See mat/config.py: --use_wandb is `action='store_false'`, so *setting*
    # it here (true) is what disables wandb logging.
    use_wandb: true

runs:
  - name: jaxmarl_robotarium_smoke_slurm
