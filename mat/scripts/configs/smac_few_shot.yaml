defaults:
  cwd: mat/scripts
  python: python
  script: train/train_smac_multi.py
  cuda_visible_devices: "0"
  args:
    env_name: StarCraft2_multi
    algorithm_name: mat
    experiment_name: "from_scratch_{train_maps}"
    train_maps: "{train_maps}"
    eval_maps: "{train_maps}"
    n_training_threads: 16
    n_eval_rollout_threads: 16
    n_rollout_threads: 32
    num_mini_batch: 1
    episode_length: 100
    eval_interval: 5
    num_env_steps: 1000000
    lr: 5e-4
    ppo_epoch: 10
    clip_param: 0.05
    use_value_active_masks: true
    use_eval: true

runs:
  - name: smac_few_shot
    seeds: [1]
    matrix:
      train_maps:
        - 27m_vs_30m
        - 8m
        - 5m_vs_6m
        - MMM2
        - 1c3s5z
        - 2s_vs_1sc
