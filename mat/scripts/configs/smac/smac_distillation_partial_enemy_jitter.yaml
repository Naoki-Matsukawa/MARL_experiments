resources:
  num_gpus: 2
  gpus_per_run: 1
  require_cuda: true
  startup_stagger_seconds: 60

slurm:
  script: mat/scripts/run_yaml_slurm.sh

defaults:
  cwd: mat/scripts
  python: python
  cuda_visible_devices: auto
  script: train/train_smac.py
  env:
    MAT_ENV_RESET_STAGGER_SECONDS: 0.5
  args:
    user_name: matsukawa-naoki555-university-of-tokyo
    env_name: StarCraft2
    algorithm_name: mat
    map_name: 3s5z_vs_3s6z
    n_training_threads: 16
    n_rollout_threads: 32
    num_mini_batch: 1
    episode_length: 100
    num_env_steps: 30000000
    lr: 5e-4
    ppo_epoch: 5
    clip_param: 0.05
    save_interval: 100000
    use_value_active_masks: true
    use_eval: true
    save_debug_render: true
    debug_render_format: gif
    debug_render_episodes: 1
    debug_render_interval: 4
    debug_render_fps: 8
    debug_render_show_sight: true
    debug_render_dir: "debug_renders/{name}_seed{seed}"
    gain: 0.01
    entropy_coef: 0.01
    gamma: 0.99
    distillation: true
    student_kl_coef: 1.0
    student_rl_coef: 1.0
    student_rl_linear_schedule: true
    student_rl_coef_start: 0.0
    max_grad_norm: 5
    noise_std: 0
    sight_range: 7
    mask_attack_by_sight: true
    randomize_enemy_position: true
    enemy_position_jitter: 1.5
    enemy_position_jitter_mode: group
    enemy_position_jitter_attempts: 20

runs:
  - name: smac_distillation_partial_enemy_jitter
    seeds: [1]
    matrix:
      sight_range: [7, 5]
      enemy_position_jitter: [2]
    args:
      experiment_name: "distill_partial_sight{sight_range}_ejitter{enemy_position_jitter}"
