defaults:
  cwd: mat/scripts
  python: python
  cuda_visible_devices: auto
  script: train/train_smac_multi.py
  args:
    user_name: matsukawa-naoki555-university-of-tokyo
    env_name: StarCraft2_multi
    algorithm_name: mat
    experiment_name: multi_task
    n_training_threads: 16
    train_maps:
      - 3s_vs_3z
      - 3s_vs_4z
      - 3m
      - MMM
      - 3s5z
      - 8m_vs_9m
      - 25m
      - 10m_vs_11m
      - 2s3z
    eval_maps:
      - 3s_vs_3z
      - 3s_vs_4z
      - 3m
      - MMM
      - 3s5z
      - 8m_vs_9m
      - 25m
      - 10m_vs_11m
      - 2s3z
    n_eval_rollout_threads: 36
    n_rollout_threads: 36
    num_mini_batch: 1
    episode_length: 100
    num_env_steps: 10000000
    lr: 5e-4
    ppo_epoch: 10
    clip_param: 0.05
    use_value_active_masks: true
    use_eval: true
    save_debug_render: true
    debug_render_format: gif
    debug_render_episodes: 1
    debug_render_interval: 4
    debug_render_fps: 8
    debug_render_show_sight: true
    debug_render_dir: "debug_renders/{name}_seed{seed}"

runs:
  - name: smac_multi
    seeds: [1]
