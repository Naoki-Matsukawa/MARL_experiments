defaults:
  cwd: mat/scripts
  python: python
  cuda_visible_devices: auto
  script: train/train_smac.py
  args:
    user_name: matsukawa-naoki555-university-of-tokyo
    env_name: StarCraft2
    algorithm_name: mat
    experiment_name: single
    map_name: 6h_vs_8z
    n_training_threads: 16
    n_rollout_threads: 32
    num_mini_batch: 1
    episode_length: 100
    num_env_steps: 10000000
    lr: 5e-4
    ppo_epoch: 15
    clip_param: 0.05
    save_interval: 100000
    use_value_active_masks: true
    use_eval: true
    save_debug_render: true
    debug_render_format: gif
    debug_render_episodes: 1
    debug_render_interval: 4
    debug_render_fps: 8
    debug_render_show_sight: true
    debug_render_dir: "debug_renders/{name}_seed{seed}"
    eval_noise_rate: 0
    final_noise_rate: 0

runs:
  - name: smac_single
    seeds: [1]
