resources:
  num_gpus: 1
  gpus_per_run: 1
  require_cuda: true

defaults:
  cwd: mat/scripts
  python: ../../.venv-cu121/bin/python
  cuda_visible_devices: auto
  script: train/train_smac.py
  args:
    user_name: matsukawa-naoki555-university-of-tokyo
    env_name: StarCraft2
    algorithm_name: mat
    experiment_name: render_mat_sight7
    map_name: 3s5z_vs_3s6z
    n_training_threads: 1
    n_rollout_threads: 1
    n_eval_rollout_threads: 1
    num_mini_batch: 1
    episode_length: 100
    num_env_steps: 1
    lr: 5e-4
    ppo_epoch: 5
    clip_param: 0.05
    use_value_active_masks: true
    use_eval: true
    eval_episodes: 1
    eval_runs: 5
    save_debug_render: true
    debug_render_format: gif
    debug_render_episodes: 1
    debug_render_interval: 1
    debug_render_fps: 8
    debug_render_show_sight: true
    debug_render_dir: "debug_renders/{name}_seed{seed}"
    gain: 0.01
    entropy_coef: 0.01
    gamma: 0.99
    noise_std: 0
    sight_range: 7
    mask_attack_by_sight: true
    model_dir: /home/mil/matsukawa/Multi-Agent-Transformer/mat/scripts/results/StarCraft2/3s5z_vs_3s6z/mat/single/wandb/run-20260115_185536-34utly1d/files/transformer_9374.pt

runs:
  - name: render_mat_smac
    seeds: [1]
