resources:
  num_gpus: 1

runs:
  - name: marbler_simple
    python: ../../.venv-cu121/bin/python
    script: train/train_marbler.py
    cwd: mat/scripts
    cuda_visible_devices: auto
    env:
      MPLCONFIGDIR: /tmp/matplotlib-cache
      MPLBACKEND: Agg
      TF_CPP_MIN_LOG_LEVEL: "2"
    args:
      user_name: matsukawa-naoki555-university-of-tokyo
      env_name: MARBLER
      scenario_name: Simple
      algorithm_name: mat
      experiment_name: marbler_simple
      seed: 1
      n_training_threads: 8
      n_rollout_threads: 8
      n_eval_rollout_threads: 4
      episode_length: 50
      num_env_steps: 1000000
      lr: 5e-4
      ppo_epoch: 5
      num_mini_batch: 1
      clip_param: 0.05
      entropy_coef: 0.01
      gamma: 0.99
      gain: 0.01
      save_interval: 100
      log_interval: 5
      eval_interval: 25
      use_eval: true
      use_value_active_masks: true
      marbler_show_figure_frequency: -1
