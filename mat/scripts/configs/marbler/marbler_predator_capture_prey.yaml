resources:
  num_gpus: 1

defaults:
  python: ../../.venv-cu121/bin/python
  script: train/train_marbler.py
  cwd: mat/scripts
  cuda_visible_devices: auto # auto
  env:
    MPLBACKEND: Agg
    MPLCONFIGDIR: /tmp/matplotlib-cache
    TF_CPP_MIN_LOG_LEVEL: "2"
  args:
    user_name: matsukawa-naoki555-university-of-tokyo
    env_name: MARBLER
    scenario_name: PredatorCapturePrey
    algorithm_name: mat
    n_training_threads: 8
    n_rollout_threads: 8
    n_eval_rollout_threads: 4
    episode_length: 80
    num_env_steps: 20000000
    lr: 5e-4
    ppo_epoch: 5
    num_mini_batch: 1
    clip_param: 0.05
    entropy_coef: 0.01
    gamma: 0.99
    gain: 0.01
    save_interval: 100
    log_interval: 5
    eval_interval: 25
    use_eval: true
    use_value_active_masks: true
    use_agent_id: true
    marbler_show_figure_frequency: -1
    marbler_k_neighbors: 1
    marbler_map_left: -2.8    # default: -1.4
    marbler_map_right: 2.8    # default:  1.4
    marbler_map_up: -1.8      # default: -0.9
    marbler_map_down: 1.8     # default:  0.9
    marbler_start_dist: 0.6   # default:  0.3
    marbler_robot_init_right_thresh: 2.8   # default: -0.5 (left half only). Set to map_right for full-map spawn.
    marbler_prey_init_left_thresh: -2.8    # default:  0.5 (right half only). Set to map_left for full-map spawn.
    gif_num_snapshots: 10

runs:
  - name: marbler_pcp
    seeds: [4, 5, 6]
    args:
      experiment_name: marbler_pcp
