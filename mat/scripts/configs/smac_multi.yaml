defaults:
  cwd: mat/scripts
  python: python
  script: train/train_smac_multi.py
  cuda_visible_devices: "0"
  args:
    env_name: StarCraft2_multi
    algorithm_name: mat
    experiment_name: multi_task
    train_maps:
      - 3s_vs_3z
      - 3s_vs_4z
      - 3m
      - MMM
      - 3s5z
      - 8m_vs_9m
      - 25m
      - 10m_vs_11m
      - 2s3z
    eval_maps:
      - 3s_vs_3z
      - 3s_vs_4z
      - 3m
      - MMM
      - 3s5z
      - 8m_vs_9m
      - 25m
      - 10m_vs_11m
      - 2s3z
    n_training_threads: 16
    n_eval_rollout_threads: 36
    n_rollout_threads: 36
    num_mini_batch: 1
    episode_length: 100
    num_env_steps: 10000000
    lr: 5e-4
    ppo_epoch: 10
    clip_param: 0.05
    use_value_active_masks: true
    use_eval: true

runs:
  - name: smac_multi
    seeds: [1]
