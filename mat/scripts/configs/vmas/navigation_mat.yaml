resources:
  num_gpus: 1

defaults:
  python: ../../.venv-cu121/bin/python
  script: train/train_vmas.py
  cwd: mat/scripts
  cuda_visible_devices: auto
  env:
    MPLBACKEND: Agg
    MPLCONFIGDIR: /tmp/matplotlib-cache
    DISPLAY: ""
  args:
    user_name: matsukawa-naoki555-university-of-tokyo
    env_name: VMAS
    scenario_name: navigation
    algorithm_name: mat
    n_training_threads: 4
    n_rollout_threads: 16
    n_eval_rollout_threads: 4
    episode_length: 100
    num_env_steps: 10000000
    lr: 5e-4
    ppo_epoch: 10
    num_mini_batch: 1
    clip_param: 0.05
    entropy_coef: 0.01
    gamma: 0.99
    gain: 0.01
    save_interval: 100
    log_interval: 5
    eval_interval: 25
    use_eval: true
    use_value_active_masks: true
    use_agent_id: true
    gif_num_snapshots: 10
    # VMAS env settings
    vmas_n_agents: 4
    vmas_continuous_actions: true
    vmas_device: cpu
    # navigation scenario kwargs
    vmas_scenario_n_obstacles: 2
    vmas_scenario_lidar_range: 0.35   # partial obs: agents see ~35% of arena radius
    vmas_scenario_shared_rew: false

runs:
  - name: vmas_navigation_mat
    seeds: [1, 2, 3]
    args:
      experiment_name: vmas_nav_mat
