[project]
name = "mat-mpe"
version = "0.1.0"
description = "Container-only dependency set for the MPE (multi-agent particle) environment"
requires-python = "==3.10.*"
dependencies = [
    "absl-py",
    "gym==0.12.4",
    "numpy==1.26.4",
    "six==1.16.0",
    "pyyaml==6.0.1",
    "wandb==0.16.6",
    "tensorboardx==2.6.2.2",
    "tqdm==4.66.4",
    "setproctitle==1.3.3",
    "scipy==1.11.4",
    "matplotlib==3.8.4",
    "imageio==2.34.1",
    "setuptools<81",
]

[tool.uv]
package = false
