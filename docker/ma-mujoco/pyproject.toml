[project]
name = "mat-ma-mujoco"
version = "0.1.0"
description = "Container-only dependency set for the multiagent_mujoco (mujoco-py) environment"
requires-python = "==3.10.*"
dependencies = [
    "absl-py",
    "mujoco-py==2.1.2.14",
    "cython<3",
    "gym==0.12.4",
    "jinja2==3.1.4",
    "numpy==1.23.5",
    "pyyaml==6.0.1",
    "wandb==0.16.6",
    "tensorboardx==2.6.2.2",
    "tqdm==4.66.4",
    "setproctitle==1.3.3",
    "scipy==1.11.4",
    "matplotlib==3.8.4",
    "imageio==2.34.1",
    "setuptools<81",
]

[tool.uv]
package = false
