[project]
name = "mat-vmas"
version = "0.1.0"
description = "Container-only dependency set for the VMAS environment"
requires-python = "==3.10.*"
dependencies = [
    "absl-py",
    # Pin to the torch build already shipped by the pytorch/pytorch base
    # image so vmas's own torch dependency doesn't pull a second, newer
    # CUDA-13 torch stack on top of it.
    "torch==2.3.1",
    "vmas==1.5.2",
    "gym==0.26.2",
    "numpy==1.26.4",
    "pyyaml==6.0.1",
    "wandb==0.16.6",
    "tensorboardx==2.6.2.2",
    "tqdm==4.66.4",
    "setproctitle==1.3.3",
    "scipy==1.11.4",
    "matplotlib==3.8.4",
    "imageio==2.34.1",
    "setuptools<81",
]

[tool.uv]
package = false
