[project]
name = "mat-jaxmarl-robotarium"
version = "0.1.0"
description = "Container-only dependency set for the JaxMARL-Robotarium discovery environment"
requires-python = "==3.10.*"
dependencies = [
    "absl-py",
    "jax[cuda12]==0.4.38",
    "flax",
    "safetensors",
    "chex",
    "brax==0.10.3",
    "mujoco==3.1.3",
    "gymnax",
    "matplotlib==3.8.4",
    "pillow==10.3.0",
    "scipy<=1.12",
    "gym==0.12.4",
    "numpy==1.26.4",
    "pyyaml==6.0.1",
    "wandb==0.16.6",
    "tensorboardx==2.6.2.2",
    "tqdm==4.66.4",
    "setproctitle==1.3.3",
    "imageio==2.34.1",
    "setuptools<81",
]

[tool.uv]
package = false
